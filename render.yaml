services:
  - type: web
    name: snsapp
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_STYLE_MODEL
        sync: false
      - key: GEMINI_AUTO_EDIT_MODEL
        sync: false
      - key: GEMINI_TTS_MODEL
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
