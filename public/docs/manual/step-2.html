<p><strong>何をするか</strong></p>
<p>音声から最初に話し始める所を見つけ、その少し前(0.15秒前)より前を切ります。</p>
<p><strong>確かめること</strong></p>
<p>動画が、話し始めの直前から始まっているか。最初の言葉が欠けていないか。</p>
<p><strong>うまくいかない時</strong></p>
<p>最初の言葉が欠けている時は、ステップ2で使う範囲の頭を少し前にしてから、工程1からやり直します。</p>
<p>確かめたら「次の工程へ」を押します。前の工程に戻る時は「前の工程へ」を押します。</p><div class="pager"><a href="/docs/manual/step-1.html">← 工程1</a><a href="/docs/manual/step-3.html">工程3 →</a></div>
