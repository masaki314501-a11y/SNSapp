<p><strong>やること:</strong> このページの <strong>「実行」</strong> を押して、上の動画と結果を見ます。良ければ <strong>「次の工程へ」</strong> を押します。</p>
<p><strong>何が起きるか</strong></p>
<p>強調字幕の頭で効果音(ポップ)を鳴らし、その場面だけ少し(1.1倍)人物に寄ります。</p>
<p><strong>見る所</strong></p>
<p>効果音と寄りが、強調字幕と同時に入っているか。</p><div class="pager"><a href="/docs/manual/step-10.html">← 工程10</a><a href="/docs/manual/step-12.html">工程12 →</a></div>
